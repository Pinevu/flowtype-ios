name: Build & Package Gboard Lintype Mod

on:
  push:
    paths:
      - 'GboardMod/**'
      - 'scripts/patch_gboard_ipa.py'
      - '.github/workflows/build-gboard-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gboard:
    name: Compile Dylib & Patch Gboard IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p build

      - name: Download base Gboard IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading Gboard_2.3.19.ipa from release assets..."
          gh release download gboard-base-assets -p "Gboard_2.3.19.ipa" -D build
          ls -lh build/Gboard_2.3.19.ipa

      - name: Compile libLintypeGboard.dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 \
            -target arm64-apple-ios12.0 \
            -dynamiclib \
            -fobjc-arc \
            -O2 \
            -Wall -Werror=implicit-function-declaration \
            -I GboardMod \
            -Wl,-undefined,dynamic_lookup \
            -framework Foundation \
            -framework CoreFoundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework AVFoundation \
            -weak_framework Speech \
            -install_name @rpath/libLintypeGboard.dylib \
            -o build/libLintypeGboard.dylib \
            GboardMod/TypelessConfig.m \
            GboardMod/TypelessHostBridge.m \
            GboardMod/TypelessSettingsView.m \
            GboardMod/TypelessAppSettingsViewController.m \
            GboardMod/TypelessOverlayView.m \
            GboardMod/TypelessVoiceManager.m \
            GboardMod/LintypeGboard.m

          file build/libLintypeGboard.dylib
          ls -lh build/libLintypeGboard.dylib

      - name: Download offline Chinese Language Model
        run: |
          echo "Downloading zh_hans.zip language model..."
          curl -sSL "https://www.gstatic.com/gboard/iOS/gboard_latest/lms/zh_hans.zip" -o build/zh_hans.zip
          ls -lh build/zh_hans.zip

      - name: Patch & Repackage Gboard IPA
        run: |
          python3 scripts/patch_gboard_ipa.py \
            build/Gboard_2.3.19.ipa \
            build/libLintypeGboard.dylib \
            build/zh_hans.zip \
            build/Gboard-Lintype-unsigned.ipa

          ls -lh build/Gboard-Lintype-unsigned.ipa
          shasum -a 256 build/Gboard-Lintype-unsigned.ipa

      - name: Verify Patched IPA Contents
        run: |
          unzip -l build/Gboard-Lintype-unsigned.ipa | grep -E "libLintypeGboard.dylib|Gboard.appex|zh_hans_lm|pinyin_system_dictionary" | head -n 40

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gboard-Lintype-unsigned-ipa
          path: build/Gboard-Lintype-unsigned.ipa
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.7-gboard"
          gh release delete "$TAG_NAME" -y 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push origin :refs/tags/"$TAG_NAME" 2>/dev/null || true

          gh release create "$TAG_NAME" build/Gboard-Lintype-unsigned.ipa \
            --title "Gboard + Typeless AI iOS 18 稳定修复与原生设置集成版 (v1.0.7)" \
            --notes "本版本（v1.0.7）针对反馈的所有闪退与核心体验问题完成底层重构修复：
          1. 【彻底修复 iOS 18 闪退】：移除 ARC 下不安全的 initWithSuiteName Hook 与启动同步大文件拷贝，改用安全的 GKBPreferences.setUserDefaults 守护与只读资源挂载。
          2. 【真正集成到 Gboard 原生设置列表（图3）且点击零闪退】：直接通过 GKBSettingsItem + GKBSettingsSection 原生注入「AI 语音与模型设置」菜单项，修正 didSelectSetting 的 NSInteger 参数签名，直达完整模型设置页与 iOS 18 保活开关。
          3. 【跨进程实时配置同步】：重构 TypelessConfig，同时写入 AppGroup NSUserDefaults、共享容器 JSON 与 Darwin 通知，主应用保存后键盘立即生效。
          4. 【真正默认简体中文九宫格，告别“下载简体中文”】：正确Hook GKBLanguageDownloader 与 GKBLanguageManager，返回真实 GKBLanguageResourceEntry 实例指向内置 zh_hans_lm，默认启用 nine_key_zh_hans 九宫格。
          5. 【解决 iOS 18 键盘录音 561145187 限制】：新增主程序后台音频保活与跨进程录音桥接（支持保活后静默直录与一键唤醒激活）。"

      - name: Deploy to GitHub Pages
        run: |
          mkdir -p /tmp/ghpages-deploy
          git clone --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/ghpages-deploy || {
            mkdir -p /tmp/ghpages-deploy
            cd /tmp/ghpages-deploy
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          }
          cp build/Gboard-Lintype-unsigned.ipa /tmp/ghpages-deploy/Gboard-Lintype-unsigned.ipa
          cd /tmp/ghpages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Gboard-Lintype-unsigned.ipa
          git commit -m "Deploy Gboard Typeless AI Mod v1.0.7" || true
          git push -u origin gh-pages --force
